name: dotoon_todo_app
description: "Dotoon is a productivity and task-management app designed to help users organize daily tasks efficiently with a clean, animated, and visually engaging interface. It focuses on simplicity, smooth UX, and delightful animations — making task management fun and intuitive."
version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  uuid: ^4.5.1
  flutter_svg: ^2.2.1
  shared_preferences:
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  animations: ^2.0.11
  date_picker_timeline: ^1.2.7
  intl: ^0.20.2
  dotted_border: ^3.1.0
  eva_icons_flutter: ^3.1.0
  syncfusion_flutter_datepicker: ^31.1.23
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  auto_size_text: ^3.0.0
  lottie: ^3.3.2
  fluentui_system_icons: ^1.1.273
  rename_app: ^1.6.5
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  image_path: "assets/dotoon.png"
  min_sdk_android: 21 # optional, only if you use adaptive icons



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0


flutter:

  uses-material-design: true


  assets:
    - assets/

  fonts:
    - family: openSans
      fonts:
        - asset: assets/fonts/open-sans.regular.ttf